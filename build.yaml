targets:
  $default:
    builders:
      fieldwise_sync|sync_config:
        enabled: true
      # A lib não tem entidades em lib/; o JSON do servidor é gerado no pacote
      # que as declara (o app). Os modelos de example/ só precisam do *.g.dart.
      fieldwise_sync|sync_config_json:
        enabled: false

builders:
  sync_config:
    import: "package:fieldwise_sync/builder.dart"
    builder_factories: ["syncConfigBuilder"]
    build_extensions: {".dart": [".sync_config.g.part"]}
    auto_apply: dependents
    build_to: cache
    applies_builders: ["source_gen:combining_builder"]
  sync_config_json:
    import: "package:fieldwise_sync/builder.dart"
    builder_factories: ["syncConfigJsonBuilder"]
    build_extensions: {"$lib$": ["sync_config.json"]}
    auto_apply: dependents
    build_to: source
